{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Set New Password</h2>
    <p class="muted">Choose a new password for your account.</p>
    <form method="POST" action="/auth/reset-password/{{ token }}">
        <div class="form-group">
            <label for="password">New Password (8+ characters)</label>
            <input type="password" name="password" id="password" required minlength="8" autofocus>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
    </form>
</div>
{% endblock %}
