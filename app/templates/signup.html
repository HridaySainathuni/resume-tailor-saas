{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Create Your Account</h2>
    <p class="muted">Get 3 free resume tailors instantly. No credit card required.</p>
    <form method="POST" action="/auth/signup">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password (8+ characters)</label>
            <input type="password" name="password" id="password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign Up Free</button>
    </form>
    <p class="auth-link" style="font-size: 0.8rem; margin-top: 0.75rem;">By signing up, you agree to our <a href="/terms">Terms</a> and <a href="/privacy">Privacy Policy</a>.</p>
    <p class="auth-link">Already have an account? <a href="/auth/login">Log in</a></p>
</div>
{% endblock %}
